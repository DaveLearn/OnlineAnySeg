[project]
name = "onlineanyseg"
version = "0.1.0"
description = "OnlineAnySeg online zero-shot 3D instance segmentation (DEG external baseline)"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# pixi: TWO environments in one project.
#
#   default     stage 2 (main.py voxel-hash pipeline + FCGF/MinkowskiEngine)
#               and the deg adapter (segment.py / segmenter.py).
#               python 3.11 (forced by the shared ../../packages/*) + the
#               README-pinned torch 2.1.0+cu118 + nvcc 11.8 + gcc 11 -- the
#               proven combination for a MinkowskiEngine source build (ME is
#               unmaintained; CUDA 12 needs source patches). pytorch3d is
#               source-built too (no py311/cu118/pyt210 wheel exists).
#               Lives in the `deg` feature, which raises
#               the nvidia channel's priority: the CUDA 11.8 toolchain only
#               exists there, and under strict priority conda-forge's 12.x-only
#               packages of the same names would otherwise shadow it.
#   cropformer  stage 1 (CropFormer entity masks + CLIP embeddings).
#               MaskClustering's proven conda-binary stack verbatim
#               (detectron2/pytorch/mmcv cuda129py311, pure conda-forge) plus
#               open-clip-torch.
#
# The adapter invokes stage 1 as `pixi run --frozen -e cropformer mask_predict`.
# No single torch has both a conda-forge detectron2 binary and a feasible ME
# build, hence the split.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-64-cuda118", platform = "linux-64", cuda = "11.8" },
    { name = "linux-64-cuda129", platform = "linux-64", cuda = "12.9" },
]

[tool.pixi.environments]
default = { features = ["deg"], no-default-feature = true }
cropformer = { features = ["cropformer"], no-default-feature = true }

# ---------------------------------------------------------------------------
# deg feature (default environment: stage 2 + adapter)
# ---------------------------------------------------------------------------
[tool.pixi.feature.deg]
# Feature channels replace the workspace list for this environment; nvidia at
# higher priority so its CUDA 11.8 toolchain isn't shadowed by conda-forge's
# 12.x-only packages of the same names under strict channel priority.
channels = ["conda-forge", { channel = "nvidia", priority = 10 }]
platforms = ["linux-64-cuda118"]

[tool.pixi.feature.deg.pypi-options.dependency-overrides]
numpy = "<2.0"

[tool.pixi.feature.deg.dependencies]
# 3.11: the shared ../../packages/* require >=3.11,<3.12. torch 2.1.0 ships
# cp311 cu118 wheels; pytorch3d has no py311/cu118/pyt210 wheel and is built
# from source by the build_pytorch3d task instead.
python = "3.11.*"
pip = ">=24"
setuptools = "<70"
wheel = "*"
git = ">=2.40"
make = "*"
ninja = "*"
unzip = "*"
# MinkowskiEngine build toolchain. gcc 10: nvcc 11.8 rejects gcc >= 12, and
# gcc 11.3+'s libstdc++ trips nvcc's std::__to_address overload ambiguity.
cuda-nvcc = "11.8.*"
cuda-toolkit = "11.8.*"
gcc_linux-64 = "10.*"
gxx_linux-64 = "10.*"
libopenblas = "*"
openblas = "*"
pybind11 = "*"
# System libraries the pypi wheels dlopen but do not bundle (open3d/opencv).
libglib = ">=2.80"
libgl = "*"
libgomp = "*"

[tool.pixi.feature.deg.pypi-dependencies]
# README-pinned torch, cu118 wheels.
torch = { version = "==2.1.0", index = "https://download.pytorch.org/whl/cu118" }
torchvision = { version = "==0.16.0", index = "https://download.pytorch.org/whl/cu118" }
# pytorch3d (ops.ball_query) is source-built by the build_pytorch3d task (no
# py311/cu118/pyt210 wheel exists); these are its runtime deps, installed here
# because the build uses --no-deps.
fvcore = "*"
iopath = "*"
# FCGF's own requirements.txt deps not already covered above: future_fstrings
# registers the source encoding its vendored modules declare (py2/py3 compat
# shim; Python's import machinery refuses to load the files without it, even
# on py3.11 where the declaration is otherwise a no-op); easydict is the
# config namespace pickled into the checkpoint's state dict.
future-fstrings = ">=1.2"
easydict = ">=1.10"
# Upstream runtime deps (torch_scatter/torchmetrics from requirements.txt are
# dead -- never imported -- and deliberately omitted).
numpy = ">=1.24,<2"
opencv-python = ">=4.8"
open3d = "==0.18.0"
scipy = ">=1.10"
scikit-learn = ">=1.3"
matplotlib = ">=3.7"
networkx = ">=3.0"
natsort = ">=8.0"
pyyaml = ">=6.0"
tqdm = ">=4.65"
tyro = ">=0.8"
huggingface-hub = ">=0.23"
pillow = ">=10.0"
# Shared deg interchange types.
psdframe = { path = "../../packages/psdframe", editable = true }
initializerdefs = { path = "../../packages/initializerdefs", editable = true }
psdstaticdataset = { path = "../../packages/psdstaticdataset", editable = true }

[tool.pixi.feature.deg.activation]
# LD_LIBRARY_PATH: pypi open3d/opencv wheels carry no RPATH into the conda env
# (libgomp/libglib), and the MinkowskiEngine build links conda openblas.
env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH", PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True" }

[tool.pixi.feature.deg.tasks]
# Bootstrap tasks declare `outputs` so pixi skips them once resolved -- safe to
# hang off segment_external; they run on the first invocation only.
bootstrap_minkowski = { cmd = "bash scripts/bootstrap_minkowski.sh", inputs = [
    "scripts/bootstrap_minkowski.sh",
], outputs = [
    "third_party/MinkowskiEngine/setup.py",
] }
build_minkowski = { cmd = "bash scripts/build_minkowski.sh", depends-on = [
    "bootstrap_minkowski",
], inputs = [
    "scripts/build_minkowski.sh",
    "scripts/patch_minkowski_sources.py",
], outputs = [
    ".build/minkowski.ok",
] }
bootstrap_pytorch3d = { cmd = "bash scripts/bootstrap_pytorch3d.sh", inputs = [
    "scripts/bootstrap_pytorch3d.sh",
], outputs = [
    "third_party/pytorch3d/setup.py",
] }
build_pytorch3d = { cmd = "bash scripts/build_pytorch3d.sh", depends-on = [
    "bootstrap_pytorch3d",
], inputs = [
    "scripts/build_pytorch3d.sh",
    "scripts/patch_pytorch3d_sources.py",
], outputs = [
    ".build/pytorch3d.ok",
] }
download_clip_checkpoint = { cmd = "python scripts/download_clip_checkpoint.py", inputs = [
    "scripts/download_clip_checkpoint.py",
], outputs = [
    "checkpoints/clip/open_clip_pytorch_model.bin",
] }
# deg external-segmenter entry point (transforms.json + scene.pkl -> objects).
# Stage 1's own bootstrap chain (Entity clone, CUDA op build) hangs off the
# `mask_predict` task in the cropformer environment, which segmenter.py invokes.
segment_external = { cmd = "python segment.py", depends-on = [
    "build_minkowski",
    "build_pytorch3d",
    "download_clip_checkpoint",
] }
# Native upstream entry points (ScanNet/SceneNN sanity checks; data is
# license-gated and manual, the installs are not).
run_native_main = { cmd = "python main.py", depends-on = ["build_minkowski", "build_pytorch3d"] }
unzip_eval_gt = { cmd = "bash scripts/unzip_eval_gt.sh", inputs = [
    "scripts/unzip_eval_gt.sh",
], outputs = [
    "eval/.gt_seg_unpacked",
] }
run_native_eval = { cmd = "python eval/evaluate_seqs.py", depends-on = ["unzip_eval_gt"] }

# ---------------------------------------------------------------------------
# cropformer feature (stage 1 environment)
# ---------------------------------------------------------------------------
[tool.pixi.feature.cropformer]
platforms = ["linux-64-cuda129"]

[tool.pixi.feature.cropformer.pypi-options.dependency-overrides]
numpy = "<2.0"

[tool.pixi.feature.cropformer.dependencies]
python = "3.11.*"
cuda = "12.9.*"
cuda-version = "12.9.*"
cython = ">=3.1.3,<4"
cxx-compiler = ">=1.11.0,<2"
detectron2 = { version = "==0.6", build = "*cuda129py311*" }
git = ">=2.49.0,<3"
make = ">=4.4.1,<5"
mmcv = { version = "==2.2.0", build = "*cuda129py311*" }
ninja = ">=1.13.0,<2"
numpy = "1.26.*"
opencv = ">=4.11.0,<5"
pip = ">=25.2,<26"
pytorch = { version = "==2.10.0", build = "*cuda129_mkl_py311*" }
scipy = ">=1.16.2,<2"
setuptools = ">=75,<82"
torchvision = { version = "==0.26.0", build = "*cuda129_py311*" }
wheel = ">=0.47.0,<0.48"

[tool.pixi.feature.cropformer.pypi-dependencies]
open-clip-torch = ">=2.24"
timm = ">=1.0"
huggingface-hub = ">=0.34.0,<1"
natsort = ">=8.0"
tqdm = ">=4.67"

[tool.pixi.feature.cropformer.tasks]
bootstrap_cropformer = { cmd = "bash scripts/bootstrap_cropformer.sh", inputs = [
    "scripts/bootstrap_cropformer.sh",
], outputs = [
    "third_party/Entity/Entityv2/CropFormer/mask2former/modeling/pixel_decoder/ops/setup.py",
] }
build_cropformer_ops = { cmd = "bash scripts/build_cropformer_ops.sh", depends-on = [
    "bootstrap_cropformer",
], inputs = [
    "scripts/build_cropformer_ops.sh",
    "scripts/patch_cropformer_sources.py",
], outputs = [
    "third_party/Entity/Entityv2/CropFormer/mask2former/modeling/pixel_decoder/ops/MultiScaleDeformableAttention*.so",
] }
download_cropformer_checkpoint = { cmd = "python scripts/download_cropformer_checkpoint.py", outputs = [
    "checkpoints/cropformer/Mask2Former_hornet_3x_576d0b.pth",
] }
# NOTE: download_cropformer_checkpoint is deliberately NOT a dependency of
# mask_predict -- the checkpoint is gated on Hugging Face (needs HF_TOKEN) and
# segment.py takes --cropformer-checkpoint, so a hard dependency would break
# both the no-token and the manually-placed-checkpoint cases. Run it once by
# hand: pixi run -e cropformer download_cropformer_checkpoint
mask_predict = { cmd = "python mask_predict.py", depends-on = ["build_cropformer_ops"] }
